# Stack container compose — Docker Compose v2 (no version: key).
#
# Required env (from a `.env` file passed via --env-file):
#   EFS_MOUNT     host path of the mounted EFS data tree
#   EFS_REPO      host path of the git checkout for the code chunkers
#   REPO_DIR      path of the repo checkout on the host (default: /opt/memex)
#   AWS_REGION    AWS region (default: eu-west-1)
#   AWS_PROFILE   AWS CLI profile (default: default)
#
# Update flow: `git pull && docker compose --env-file .env -f deploy/docker-compose.yml up -d --build`

services:

  memex:
    build:
      context: ./memex
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "18790"
    volumes:
      # Config + soul templates live on EFS so they survive container
      # rebuilds. The actual index sits in RDS Postgres (URL injected
      # via MEMEX_POSTGRES_URL env from .secrets/memex.env).
      - ${EFS_MOUNT}/memex:/home/bun/.memex
      # Read-only access to openclaw's persistent session memory so the
      # agent can search "what we discussed" across past sessions.
      - ${EFS_MOUNT}/workspace/memory:/memory:ro
      # Read-only access to the repo checkout for the code chunkers.
      # bootstrap.sh clones ${EFS_REPO} alongside the EFS mount; if
      # absent the serve.ts boot WARNs "0 indexable files" and continues
      # — non-fatal so a missing checkout doesn't take the brain down.
      - ${EFS_REPO}:/repo-source:ro
      # AWS CLI inside the container needs config + region to resolve;
      # credentials themselves come from the IMDSv2 EC2 IAM role via
      # `credential_source = Ec2InstanceMetadata` in the mounted config.
      - /home/ec2-user/.aws:/home/bun/.aws:ro
    environment:
      - AWS_REGION=${AWS_REGION:?AWS_REGION must be set}
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - SECRETS_PREFIX=${SECRETS_PREFIX:-memex}
      - HOME=/home/bun
      # Filesystem-watch recipes are paused for the DB-canonical
      # redesign (see ~/.claude memory: memex-master-plan.md Phase 0).
      # The `openclaw memory` mount above stays read-only for the
      # session-history search recipe — that's runtime state, not a
      # primary content store.
      - MEMEX_VAULT_PATHS=/memory
      - MEMEX_SWEEP_DELAY_MS=50
      - MEMEX_SWEEP_MAX_FILES=1000
      # Code chunkers: graph-only call/def/ref index over the stack
      # repo. Re-swept on container boot (mtime-skip). Add more paths
      # CSV-style to index sibling repos.
      - MEMEX_CODE_PATHS=/repo-source
      - MEMEX_CODE_SWEEP_DELAY_MS=20
      # 6-phase cycle every 6h. Re-embeds docs older than 30d. The
      # configured quiet-hours window skips the costly embed-stale
      # phase so it doesn't fight the morning-briefing cron for CPU.
      - MEMEX_DREAM_INTERVAL_S=21600
      - MEMEX_DREAM_STALE_DAYS=30
    env_file:
      # MEMEX_POSTGRES_URL (RDS endpoint) and MEMEX_PUBLIC_BEARER
      # (public-ingress auth) — written by deploy/secrets/fetch-secrets.sh
      # from <secrets_prefix>/memex-postgres-url and
      # <secrets_prefix>/memex-public-bearer.
      - path: .secrets/memex.env
        required: false
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18790/health | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  openclaw:
    build:
      context: ./openclaw
      dockerfile: Dockerfile
      args:
        OPENCLAW_VERSION: "2026.4.29"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "18789"
    volumes:
      # Mount only the *state* dirs from EFS. Do NOT mount ${EFS_MOUNT}
      # wholesale — EFS may carry multiple plugin-runtime-deps/openclaw-X
      # versions and a runtime-mirror lock dir that wedge the chat agent
      # on container boot. plugin-runtime-deps must live inside the
      # container so it matches the pinned upstream version.
      - ${EFS_MOUNT}/cron:/home/openclaw/.openclaw/cron
      - ${EFS_MOUNT}/devices:/home/openclaw/.openclaw/devices
      - ${EFS_MOUNT}/tasks:/home/openclaw/.openclaw/tasks
      - ${EFS_MOUNT}/agents:/home/openclaw/.openclaw/agents
      - ${EFS_MOUNT}/flows:/home/openclaw/.openclaw/flows
      - ${EFS_MOUNT}/telegram:/home/openclaw/.openclaw/telegram
      - ${EFS_MOUNT}/identity:/home/openclaw/.openclaw/identity
      - ${EFS_MOUNT}/delivery-queue:/home/openclaw/.openclaw/delivery-queue
      - ${EFS_MOUNT}/credentials:/home/openclaw/.openclaw/credentials
      - ${EFS_MOUNT}/canvas:/home/openclaw/.openclaw/canvas
      - ${EFS_MOUNT}/media:/home/openclaw/.openclaw/media
      - ${EFS_MOUNT}/workspace:/home/openclaw/.openclaw/workspace
      - ${EFS_MOUNT}/skills:/home/openclaw/.openclaw/skills:ro
      # AWS CLI config (region + credential_source = Ec2InstanceMetadata).
      # Credentials themselves come via IMDSv2 from the EC2 IAM role.
      - /home/ec2-user/.aws:/home/openclaw/.aws:ro
      - ${REPO_DIR:-/opt/memex}/deploy/.secrets:/run/secrets:ro
    environment:
      - AWS_REGION=${AWS_REGION:?AWS_REGION must be set}
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - SECRETS_PREFIX=${SECRETS_PREFIX:-memex}
      - HOME=/home/openclaw
      # PUBLIC_HOST is the chat-UI hostname (e.g. chat.example.com). The
      # gateway needs it baked in so the CLI's local control-UI scope
      # requests resolve; without it `openclaw cron add` fails with
      # "scope upgrade pending approval".
      - PUBLIC_HOST=${PUBLIC_HOST:?PUBLIC_HOST must be set in .env}
      - MEMEX_HOST=${MEMEX_HOST:-}
      # Default: the telegram-bridge container owns the bot's
      # `getUpdates` long-poll, so openclaw must NOT also try to
      # connect (Telegram refuses with 409 Conflict if both do).
      # Override by exporting OPENCLAW_TELEGRAM_DISABLED=0 in .env if
      # you want openclaw to own Telegram and disable the bridge.
      - OPENCLAW_TELEGRAM_DISABLED=${OPENCLAW_TELEGRAM_DISABLED:-1}
    networks:
      - internal
    depends_on:
      memex:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18789/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  telegram-bridge:
    # Standalone two-way Telegram surface. Runs independent of openclaw
    # so the bot keeps replying even when the chat-agent container is
    # restarting, mid-rebuild, or stuck on a paired-device approval.
    # See deploy/telegram-bridge/README.md for the design rationale.
    build:
      # Context is `./` (the deploy/ tree) so the Dockerfile can COPY
      # both `telegram-bridge/main.py` and `openclaw/helpers/*` from a
      # single context. Avoids duplicating the helper sources across
      # two image trees.
      context: ./
      dockerfile: telegram-bridge/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # /tmp inside the container is a tmpfs — the only writable path the
    # daemon needs aside from /var/lib/memex-bridge. Keeps the rest of
    # the filesystem read-only (`read_only: true` below) so a bug in
    # `aws bedrock-runtime invoke-model` (which writes JSON to /tmp)
    # can't drop files anywhere else.
    read_only: true
    tmpfs:
      # noexec (default) — the only thing this daemon ever writes to
      # /tmp is JSON output from `aws bedrock-runtime invoke-model`,
      # never something we then execute. Dropping `exec` removes the
      # write-then-run vector if a future bug lets attacker bytes
      # land in /tmp. mode=0700 + uid pin keeps the dir owner-only.
      - /tmp:uid=10001,gid=10001,size=16m,mode=1700
    volumes:
      # Persist `state.json` (last update id) so a restart doesn't
      # replay the past 24h of messages. EFS-backed for safety; a host
      # bind-mount would also work.
      - ${EFS_MOUNT}/telegram-bridge:/var/lib/memex-bridge
      # AWS CLI config — bridge runs as uid 10001 (USER bridge), so
      # the host /home/ec2-user/.aws is mounted at the bridge user's
      # HOME (/home/bridge/.aws) rather than /root.
      - /home/ec2-user/.aws:/home/bridge/.aws:ro
      # Secrets dir holds telegram-bot-token.txt populated by
      # deploy/secrets/fetch-secrets.sh on the host.
      - ${REPO_DIR:-/opt/memex}/deploy/.secrets:/run/secrets:ro
    environment:
      - AWS_REGION=${AWS_REGION:?AWS_REGION must be set}
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - SECRETS_PREFIX=${SECRETS_PREFIX:-memex}
      - MEMEX_URL=http://memex:18790
      # Required: comma-separated numeric Telegram chat ids that may
      # talk to the bot. Set in `.env` from
      # `MEMEX_BRIDGE_ALLOWED_CHAT_IDS=...`.
      - MEMEX_BRIDGE_ALLOWED_CHAT_IDS=${MEMEX_BRIDGE_ALLOWED_CHAT_IDS:?MEMEX_BRIDGE_ALLOWED_CHAT_IDS must be set (comma-separated numeric chat ids)}
      - MEMEX_BRIDGE_LLM_MODEL=${MEMEX_BRIDGE_LLM_MODEL:-global.amazon.nova-2-lite-v1:0}
      - MEMEX_BRIDGE_MAX_HITS=${MEMEX_BRIDGE_MAX_HITS:-5}
      - MEMEX_BRIDGE_LLM_DISABLE=${MEMEX_BRIDGE_LLM_DISABLE:-}
    networks:
      - internal
    depends_on:
      memex:
        condition: service_healthy
    # Healthcheck is positive: the bridge is healthy only while
    # `main.py` is in the process table. `start_period` covers the
    # entrypoint's `aws sts get-caller-identity` warm-up.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /app/main.py >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    # SIGTERM during a 25s long-poll would otherwise exceed docker's
    # default 10s grace, get SIGKILL'd, and lose the unflushed offset.
    stop_grace_period: 40s

  cloudflared:
    # Uses upstream image directly — no custom Dockerfile needed.
    # Tag pinned; bump intentionally after a smoke test.
    image: cloudflare/cloudflared:2025.4.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # cloudflared reads TUNNEL_TOKEN from env when --token is omitted.
    # We deliberately do NOT use ${...} interpolation in command: because
    # docker-compose interpolates that at parse time (before env_file is
    # loaded), which would silently pass --token "" and loop forever.
    #
    # --protocol http2: when the EC2 security group only allows TCP egress
    # on 7844 (the typical default), cloudflared otherwise tries QUIC over
    # UDP/7844 first and times out repeatedly before falling back. http2
    # is reliable from minute 1.
    command: tunnel --no-autoupdate --protocol http2 run
    env_file:
      - path: .secrets/cloudflared.env
        required: false  # absent on local dev; present on EC2 after fetch-secrets.sh
    networks:
      - internal
    depends_on:
      openclaw:
        condition: service_healthy

networks:
  internal:
    driver: bridge
