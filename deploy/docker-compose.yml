# Stack container compose — Docker Compose v2 (no version: key).
#
# Required env (from a `.env` file passed via --env-file):
#   EFS_MOUNT     host path of the mounted EFS data tree
#   EFS_REPO      host path of the git checkout for the code chunkers
#   REPO_DIR      path of the repo checkout on the host (default: /opt/memex)
#   AWS_REGION    AWS region (default: eu-west-1)
#   AWS_PROFILE   AWS CLI profile (default: default)
#
# Update flow: `git pull && docker compose --env-file .env -f deploy/docker-compose.yml up -d --build`

services:

  memex:
    build:
      context: ./memex
      dockerfile: Dockerfile
    restart: unless-stopped
    # Cap container memory so a runaway (a cycle phase has hit 3.48 GB RSS on
    # the ~3.7 GB host) is a clean cgroup OOM-kill + restart of THIS container,
    # not a kernel global-OOM that kills an arbitrary process (Postgres client,
    # cloudflared) and strands the cycle lock. Tunable via the host .env; leaves
    # headroom for cloudflared + the system on a small instance.
    mem_limit: ${MEMEX_MEM_LIMIT:-3000m}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "18790"
    volumes:
      # Config + soul templates live on EFS so they survive container
      # rebuilds. The actual index sits in RDS Postgres (URL injected
      # via MEMEX_POSTGRES_URL env from .secrets/memex.env).
      - ${EFS_MOUNT}/memex:/home/bun/.memex
      # Read-only mount of operator-provided content for the indexer to
      # sweep (markdown notes, archived conversations, etc.).
      - ${EFS_MOUNT}/workspace/memory:/memory:ro
      # Read-only access to the repo checkout for the code chunkers.
      # bootstrap.sh clones ${EFS_REPO} alongside the EFS mount; if
      # absent the serve.ts boot WARNs "0 indexable files" and continues
      # — non-fatal so a missing checkout doesn't take the brain down.
      - ${EFS_REPO}:/repo-source:ro
      # AWS CLI inside the container needs config + region to resolve;
      # credentials themselves come from the IMDSv2 EC2 IAM role via
      # `credential_source = Ec2InstanceMetadata` in the mounted config.
      - /home/ec2-user/.aws:/home/bun/.aws:ro
    environment:
      - AWS_REGION=${AWS_REGION:?AWS_REGION must be set}
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - SECRETS_PREFIX=${SECRETS_PREFIX:-memex}
      - HOME=/home/bun
      # Filesystem-watch recipes are paused for the DB-canonical
      # redesign (see ~/.claude memory: memex-master-plan.md Phase 0).
      # `/memory` is mounted read-only above so the search recipe can
      # still see archived content alongside DB-canonical pages.
      - MEMEX_VAULT_PATHS=/memory
      - MEMEX_SWEEP_DELAY_MS=50
      - MEMEX_SWEEP_MAX_FILES=1000
      # Code chunkers: graph-only call/def/ref index over the stack
      # repo. Re-swept on container boot (mtime-skip). Add more paths
      # CSV-style to index sibling repos.
      - MEMEX_CODE_PATHS=/repo-source
      - MEMEX_CODE_SWEEP_DELAY_MS=20
      # 6-phase cycle every 6h. Re-embeds docs older than 30d. The
      # configured quiet-hours window skips the costly embed-stale
      # phase so heavyweight ingest doesn't run during quiet hours.
      - MEMEX_DREAM_INTERVAL_S=21600
      - MEMEX_DREAM_STALE_DAYS=30
      # Per-cycle-phase wall-clock cap so a hung phase (e.g. a Bedrock call with
      # no client timeout) can't wedge the whole tick and strand the cycle lock.
      # Default 15min; lower via the host .env for faster recovery on a small
      # instance (phases are individually bounded — embed-stale caps at 50/cycle).
      - MEMEX_CYCLE_PHASE_TIMEOUT_MS=${MEMEX_CYCLE_PHASE_TIMEOUT_MS:-900000}
      # Operator escape hatch — CSV of cycle phases to skip every tick, to isolate
      # a phase with a live defect without losing the rest of the cycle (set in
      # the host .env, default none).
      - MEMEX_CYCLE_SKIP_PHASES=${MEMEX_CYCLE_SKIP_PHASES:-}
      # Opt-in auto-think (default OFF). =1 appends the Claude Haiku synthesis
      # chain (atoms→concepts→takes→grade→calibration → the isolated synth_* store,
      # read via list_concepts/list_takes) to QUIET-HOURS ticks only. Count-capped
      # (MEMEX_DREAM_SYNTHESIS_MAX_DOCS/_MAX_CONCEPTS/_MAX_TAKES/_MIN_GRADED), Claude
      # Haiku via Bedrock, idempotent. Leave unset to keep the brain pure-retrieval.
      - MEMEX_DREAM_SYNTHESIS=${MEMEX_DREAM_SYNTHESIS:-}
      # Opt-in per-source (per-tenant) doctor warn check (default OFF, free). =1
      # makes `doctor` WARN when any single source has chunks but zero embeddings.
      - MEMEX_DOCTOR_PER_SOURCE=${MEMEX_DOCTOR_PER_SOURCE:-}
      # Opt-in multi-tenant fail-closed read/write floor (default OFF). =1 makes an
      # authenticated PUBLIC principal with no source grant read/write nothing
      # instead of the redacted whole brain. The static bearer (no authInfo) is
      # unaffected. Flip once a real remote OAuth tenant with a grant exists.
      - MEMEX_TENANT_FAIL_CLOSED=${MEMEX_TENANT_FAIL_CLOSED:-}
      # Public-ingress writes (opt-in, default OFF). When =1, the public /mcp
      # path (static bearer or OAuth) may call the CONSTRUCTIVE write tools
      # (index, page_put, page_append, add_fact, add_timeline_event, add_tag,
      # link). Destructive ops + privacy-sensitive reads stay internal-only
      # regardless. Set =1 in the host .env to activate.
      - MEMEX_PUBLIC_WRITE=${MEMEX_PUBLIC_WRITE:-0}
      # --- Paid opt-in Bedrock Claude Sonnet slices (all default OFF) ---------
      # Each makes a PAID Sonnet call only when its flag is set, bounded by its
      # own USD BudgetTracker (*_BUDGET_USD, default 1.0). See docs/CONFIGURATION.md.
      # think: `memex think <q>` deep synthesis (CLI). relational-LLM: Sonnet
      # fallback for the relational arm. graph-rerank: Sonnet rerank per search.
      # deep-synth: scheduled think over top concepts. take-ensemble: N-judge
      # Sonnet grading of takes. facts-extraction: conversation→facts.
      - MEMEX_THINK=${MEMEX_THINK:-}
      - MEMEX_THINK_BUDGET_USD=${MEMEX_THINK_BUDGET_USD:-}
      - MEMEX_RELATIONAL_LLM=${MEMEX_RELATIONAL_LLM:-}
      - MEMEX_RELATIONAL_LLM_BUDGET_USD=${MEMEX_RELATIONAL_LLM_BUDGET_USD:-}
      - MEMEX_GRAPH_RERANK=${MEMEX_GRAPH_RERANK:-}
      - MEMEX_GRAPH_RERANK_BUDGET_USD=${MEMEX_GRAPH_RERANK_BUDGET_USD:-}
      - MEMEX_DEEP_SYNTH=${MEMEX_DEEP_SYNTH:-}
      - MEMEX_DEEP_SYNTH_BUDGET_USD=${MEMEX_DEEP_SYNTH_BUDGET_USD:-}
      - MEMEX_DEEP_SYNTH_MAX_QUESTIONS=${MEMEX_DEEP_SYNTH_MAX_QUESTIONS:-}
      - MEMEX_TAKE_ENSEMBLE=${MEMEX_TAKE_ENSEMBLE:-}
      - MEMEX_TAKE_ENSEMBLE_BUDGET_USD=${MEMEX_TAKE_ENSEMBLE_BUDGET_USD:-}
      - MEMEX_TAKE_ENSEMBLE_JUDGES=${MEMEX_TAKE_ENSEMBLE_JUDGES:-}
      - MEMEX_FACTS_EXTRACTION=${MEMEX_FACTS_EXTRACTION:-}
      - MEMEX_FACTS_BUDGET_USD=${MEMEX_FACTS_BUDGET_USD:-}
      # Contextual-retrieval embed wrapper (LLM-free). Enabling it changes ONLY
      # future embeds — run a full re-embed after enabling, or the vector space
      # becomes mixed (wrapped + unwrapped) and search quality degrades.
      - MEMEX_CONTEXTUAL_RETRIEVAL=${MEMEX_CONTEXTUAL_RETRIEVAL:-}
      # PAID per-chunk contextual-retrieval tier (Haiku): each chunk gets an
      # LLM-generated blurb situating it in its document. Bounded by its own
      # budget (default 5.0). Enable, then run `reindex --contextual` to backfill.
      - MEMEX_CONTEXTUAL_LLM=${MEMEX_CONTEXTUAL_LLM:-}
      - MEMEX_CONTEXTUAL_LLM_BUDGET_USD=${MEMEX_CONTEXTUAL_LLM_BUDGET_USD:-}
      # Override the paid-tier model (default eu.anthropic.claude-sonnet-4-6).
      - MEMEX_FACTS_MODEL=${MEMEX_FACTS_MODEL:-}
    env_file:
      # MEMEX_POSTGRES_URL (RDS endpoint) and MEMEX_PUBLIC_BEARER
      # (public-ingress auth) — written by deploy/secrets/fetch-secrets.sh
      # from <secrets_prefix>/memex-postgres-url and
      # <secrets_prefix>/memex-public-bearer.
      - path: .secrets/memex.env
        required: false
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18790/health | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    # Uses upstream image directly — no custom Dockerfile needed.
    # Tag pinned; bump intentionally after a smoke test.
    image: cloudflare/cloudflared:2025.4.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # cloudflared reads TUNNEL_TOKEN from env when --token is omitted.
    # We deliberately do NOT use ${...} interpolation in command: because
    # docker-compose interpolates that at parse time (before env_file is
    # loaded), which would silently pass --token "" and loop forever.
    #
    # --protocol http2: when the EC2 security group only allows TCP egress
    # on 7844 (the typical default), cloudflared otherwise tries QUIC over
    # UDP/7844 first and times out repeatedly before falling back. http2
    # is reliable from minute 1.
    command: tunnel --no-autoupdate --protocol http2 run
    env_file:
      - path: .secrets/cloudflared.env
        required: false  # absent on local dev; present on EC2 after fetch-secrets.sh
    networks:
      - internal
    depends_on:
      # Cloudflared's public ingress targets memex (brain.<domain>/mcp).
      memex:
        condition: service_healthy

networks:
  internal:
    driver: bridge
