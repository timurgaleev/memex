# Cross-Modal Review Configuration
# Which skills review which outputs, and the retry routing chain.

review_pairs:
  # After brain writes, optionally verify quality
  - trigger_skill: idea-ingest
    review_skill: cross-modal-review
    when: "page has >500 words or mentions >3 entities"

  - trigger_skill: media-ingest
    review_skill: cross-modal-review
    when: "transcript enrichment produces >5 entity updates"

  - trigger_skill: meeting-ingestion
    review_skill: cross-modal-review
    when: "meeting has >5 attendees"

  - trigger_skill: enrich
    review_skill: cross-modal-review
    when: "Tier 1 enrichment (full pipeline)"

refusal_routing:
  # When a model declines a benign request, retry within the Bedrock tiers
  chain:
    - synthesis   # Sonnet tier — default for review work
    - utility     # Haiku tier — rephrased, narrower retry
  behavior: "silent_retry"
  rule: "Rephrase and retry once per tier without announcing it. If both tiers decline, surface to the user plainly — never fabricate a review."

spawn_rules:
  threshold: 3  # 3+ items = spawn a sub-agent
  model: "utility" # Haiku tier — cheapest that handles pass/fail review
  timeout_seconds: 120
