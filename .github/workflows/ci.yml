name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: PII audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: make audit
        run: make audit
      - name: make scrub-audit
        run: make scrub-audit
      - name: migration search_path guard
        run: bash scripts/check-search-path.sh

  bash-tests:
    name: Bash unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: make test
        run: make test

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.6.6"
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint scripts
        run: shellcheck scripts/*.sh tests/*.test.sh deploy/*.sh deploy/secrets/fetch-secrets.sh deploy/memex/scripts/*.sh

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: pytest
        run: pytest tests/test_*.py -v

  bun-tests:
    # Production target is t4g.medium (arm64). Local devs are usually
    # on amd64. Run the bun suite on both so an arm64-only Bun runtime
    # regression — or a transitive native module that has no arm64
    # wheel — fails CI before it can quietly break the EC2 deploy.
    name: Memex Bun tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # arm64 is the production target (t4g.medium) but free arm64
    # runners are 3-4x slower than amd64 for this PGLite-heavy
    # suite (~45 min vs 11 min). To avoid blocking ship on a slow
    # runner, arm64 is non-blocking (continue-on-error) -- it
    # still runs as a canary signal and any failure is visible in
    # CI history, but the gate is amd64. The deploy /health smoke
    # on the live t4g.medium catches arm64-specific regressions
    # within ~2 minutes of merge.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    # 90, not 60: the free arm64 canary runs the full sharded suite on a 3-4x
    # slower runner and, as the suite grew, began grazing the old 60-min cap —
    # a TIMEOUT shows as "cancelled" and drags the whole run's badge even though
    # the amd64 GATE is green. The extra margin lets the canary finish with a
    # real green/red verdict. amd64 finishes in ~11 min, so this never affects
    # the gate. (arm64 stays continue-on-error — it is a signal, not a gate.)
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # Default bun per-test timeout (5s) — amd64 is the gate, so
            # keep it tight to catch genuine perf regressions.
            test_timeout_ms: 5000
            # 0 = no wall-clock budget: the GATE always runs every shard.
            max_seconds: 0
          - arch: arm64
            runner: ubuntu-24.04-arm
            # Free arm64 runners are 3-4x slower; PGLite cold-init +
            # Bun.serve startup intermittently push individual tests past
            # the 5s default. Raise the per-test budget for this canary
            # leg so a slow runner is not misread as a logic failure.
            # NOTE: 30s is a slow-runner allowance, NOT a latency target —
            # arm64 is continue-on-error, so do not read its green as a
            # perf signal.
            test_timeout_ms: 30000
            # Wall-clock budget for the WHOLE sharded loop. The grown suite now
            # runs past the 90-min job cap on the slow arm64 runner, and a job
            # that hits timeout-minutes is CANCELLED — which continue-on-error
            # does NOT absorb, so it reddened the whole run's badge even though
            # the amd64 gate was green. Stop the canary early (well under the
            # cap) so it exits normally: a real shard failure is then a tolerated
            # `failure`, and a pure time-overrun is a clean partial signal —
            # neither cancels the run. 4200s = 70 min.
            max_seconds: 4200
    defaults:
      run:
        working-directory: deploy/memex
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: typecheck (src)
        # Runs BEFORE the suite: a type error is cheaper to read than a shard
        # failure, and until this step existed the compiler had never been run
        # over the repo at all — its first run found a real defect in `doctor`.
        # Scoped to src/ because tests/ still carries a backlog of
        # noUncheckedIndexedAccess errors; `bun run typecheck:all` reports it.
        run: bun run typecheck
      - name: bun test (sharded)
        # The loop lives in scripts/test-sharded.sh so CI and the local ship
        # gate run the SAME sharding — the whole suite in one `bun test`
        # process exhausts memory (see the script header for why), which is
        # not a CI-only constraint. Per-test timeout and the wall-clock budget
        # are arch-specific (see matrix): tight on the amd64 gate, relaxed on
        # the slow arm64 canary, which also stops early rather than being
        # CANCELLED by the job cap.
        env:
          TEST_TIMEOUT: ${{ matrix.test_timeout_ms }}
          MAX_SECONDS: ${{ matrix.max_seconds }}
          SHARD_SIZE: "20"
        run: bash scripts/test-sharded.sh
