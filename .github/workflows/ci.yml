name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: PII audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: make audit
        run: make audit
      - name: make scrub-audit
        run: make scrub-audit

  bash-tests:
    name: Bash unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: make test
        run: make test

  terraform-validate:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.6.6"
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: terraform validate
        working-directory: terraform
        run: terraform validate

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint scripts
        run: shellcheck scripts/*.sh tests/*.test.sh deploy/telegram-bridge/entrypoint.sh deploy/secrets/fetch-secrets.sh

  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml
      - name: pytest
        run: pytest tests/test_*.py -v

  bun-tests:
    # Production target is t4g.medium (arm64). Local devs are usually
    # on amd64. Run the bun suite on both so an arm64-only Bun runtime
    # regression — or a transitive native module that has no arm64
    # wheel — fails CI before it can quietly break the EC2 deploy.
    name: Memex Bun tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # arm64 is the production target (t4g.medium) but free arm64
    # runners are 3-4x slower than amd64 for this PGLite-heavy
    # suite (~45 min vs 11 min). To avoid blocking ship on a slow
    # runner, arm64 is non-blocking (continue-on-error) -- it
    # still runs as a canary signal and any failure is visible in
    # CI history, but the gate is amd64. The deploy /health smoke
    # on the live t4g.medium catches arm64-specific regressions
    # within ~2 minutes of merge.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: deploy/memex
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: bun test
        # Run the full memex suite — includes the path_guard / body_limit
        # / concurrency / rate_limit_eviction tests added this round
        # plus the pre-existing chunker / search / migrate suites.
        run: bun test
