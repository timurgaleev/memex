name: Supply chain

# Advisory only: every job is continue-on-error and none is a required check.
# The ship gate is the local run (`make audit`, `make scrub-audit`, the test
# suites); these jobs leave a signal in CI history without blocking a push.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history gitleaks pass (a scheduled run has no range and
    # falls through to --all): the backstop for any push range a run missed.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# gitleaks scans only the range each push adds, so a push run must never be
# cancelled or replaced: a superseded run's commits would go unscanned. GitHub
# keeps one pending run per group even with cancel-in-progress off, so pushes
# get a group of their own. A PR run scans base..head, so the newest one
# covers everything a superseded one would have.
concurrency:
  group: supply-chain-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (commit range)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: install gitleaks
        # A release binary checked against a hardcoded checksum rather than a
        # third-party action: nothing outside this file decides what runs.
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "${GITHUB_SERVER_URL}/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        # Scan only what this event introduced. A new branch (all-zero
        # `before`), a force-push whose `before` is gone, or a manual run
        # falls back to the full history.
        run: |
          RANGE="--all"
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ] \
            && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..${SHA}"
          fi
          echo "scanning: $RANGE"
          gitleaks git --redact --config .gitleaks.toml --log-opts="$RANGE" .

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: install actionlint
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o actionlint.tar.gz \
            "${GITHUB_SERVER_URL}/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: actionlint
        # shellcheck ships on ubuntu-latest, so `run:` blocks are linted too.
        run: actionlint -color
